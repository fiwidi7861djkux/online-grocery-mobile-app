name: CI/CD Pipeline - Test and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  # Backend Testing (Must Pass)
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          # Check if lockfile has actual dependencies locked
          if grep -q '"resolved":' package-lock.json 2>/dev/null; then
            echo "Using npm ci with fully locked dependencies"
            npm ci
          else
            echo "Using npm install to generate proper lockfile"
            npm install
          fi
        else
          echo "No lockfile found, using npm install"
          npm install
        fi
      
    - name: Run ESLint
      run: npm run lint:check
      
    - name: Run type checking
      run: npm run type-check
      
    - name: Run unit tests with coverage
      run: npm run test
      
    - name: Run integration tests
      run: npm run test:integration
      
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        fail_ci_if_error: true

  # Android Testing (Must Pass)
  android-test:
    name: Android Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-app]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create local.properties
      run: |
        echo "api.base.url=https://online-grocery-mobile-app.vercel.app" > ${{ matrix.app }}/local.properties
        
    - name: Run unit tests with coverage
      run: |
        cd ${{ matrix.app }}
        ./gradlew testDebugUnitTest --continue
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Android Test Results - ${{ matrix.app }}
        path: '${{ matrix.app }}/app/build/test-results/testDebugUnitTest/TEST-*.xml'
        reporter: java-junit
        
    - name: Run lint checks
      run: |
        cd ${{ matrix.app }}
        ./gradlew lintDebug
        
    - name: Build debug APK (Test Build)
      run: |
        cd ${{ matrix.app }}
        ./gradlew assembleDebug
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.app }}-debug-apk
        path: ${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
        retention-days: 7

  # Security Scan (Must Pass)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '1' # Fail if vulnerabilities found
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy Backend to Vercel (Only if all tests pass)
  deploy-backend:
    name: Deploy Backend to Vercel
    runs-on: ubuntu-latest
    needs: [backend-test, android-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          if grep -q '"resolved":' package-lock.json 2>/dev/null; then
            npm ci
          else
            npm install
          fi
        else
          npm install
        fi
      
    - name: Run tests one more time before deploy
      run: npm run test
      
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./backend
        scope: ${{ secrets.VERCEL_ORG_ID }}
        
    - name: Get deployment URL
      id: deployment
      run: echo "url=https://online-grocery-mobile-app.vercel.app" >> $GITHUB_OUTPUT
      
    - name: Test deployed API
      run: |
        sleep 30 # Wait for deployment to be ready
        curl -f ${{ steps.deployment.outputs.url }}/api/health || exit 1
        
  # Post-Deployment Validation
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Test health endpoint
      run: |
        response=$(curl -s https://online-grocery-mobile-app.vercel.app/api/health)
        echo "API Response: $response"
        echo $response | jq -e '.status == "healthy"' > /dev/null || exit 1
        echo "✅ Health check passed!"
        
    - name: Test CORS headers
      run: |
        curl -H "Origin: https://localhost:3000" \
             -H "Access-Control-Request-Method: GET" \
             -H "Access-Control-Request-Headers: X-Requested-With" \
             -X OPTIONS \
             https://online-grocery-mobile-app.vercel.app/api/health
        echo "✅ CORS headers working!"
        
    - name: Validate API response structure
      run: |
        response=$(curl -s https://online-grocery-mobile-app.vercel.app/api/health)
        echo $response | jq -e '.message' > /dev/null || exit 1
        echo $response | jq -e '.version' > /dev/null || exit 1
        echo $response | jq -e '.timestamp' > /dev/null || exit 1
        echo $response | jq -e '.services' > /dev/null || exit 1
        echo "✅ API response structure is valid!"

  # Notification on Success/Failure
  notify-completion:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [backend-test, android-test, security-scan, deploy-backend, validate-deployment]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.backend-test.result == 'success' && needs.android-test.result == 'success' && needs.validate-deployment.result == 'success'
      run: |
        echo "🎉 ITERATION 1 COMPLETE!"
        echo "✅ Backend tests: PASSED"
        echo "✅ Android tests: PASSED"
        echo "✅ Security scan: PASSED"
        echo "✅ Deployment: SUCCESS"
        echo "✅ Validation: SUCCESS"
        echo ""
        echo "🚀 API is live at: https://online-grocery-mobile-app.vercel.app/api/health"
        echo "📱 Ready to test mobile app integration!"
        
    - name: Notify failure
      if: needs.backend-test.result == 'failure' || needs.android-test.result == 'failure' || needs.validate-deployment.result == 'failure'
      run: |
        echo "❌ ITERATION 1 FAILED - Tests must pass before deployment"
        echo "Backend tests: ${{ needs.backend-test.result }}"
        echo "Android tests: ${{ needs.android-test.result }}"
        echo "Security scan: ${{ needs.security-scan.result }}"
        echo "Deployment: ${{ needs.deploy-backend.result }}"
        echo "Validation: ${{ needs.validate-deployment.result }}"
        exit 1